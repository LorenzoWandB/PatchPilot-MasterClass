[project]
name = "agent-loop-workshop"
version = "2.0.0"
description = "A guided workshop for tracing, evaluating, and improving an AI agent with W&B Weave."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "marimo>=0.21,<0.24",
  "openai>=1.100,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "weave>=0.52,<0.54",
]

[tool.ruff]
line-length = 100
target-version = "py311"
